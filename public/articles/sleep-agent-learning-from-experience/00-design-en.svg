<text x="174" y="875" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0a0a0a">tasks solved by every method</text>
<text x="50" y="914" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#0a0a0a">A shared zero does not establish method equivalence.</text>
