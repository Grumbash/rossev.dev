# ONE-OFF, delete before merge: on this PR, regenerates two posts already on the site with the
# Publora sync's new RU prompt and writes the RU on main next to the new draft to the Job Summary
# (scripts/ci/publora-ru-sample.ts). Writes nothing to the repo, comments nowhere. The key comes
# only from repo secrets.
name: publora-ru-sample

on:
  pull_request:
    paths:
      - 'scripts/ci/publora-ru-sample.ts'
      - '.github/workflows/publora-ru-sample.yml'

permissions:
  contents: read

concurrency:
  group: publora-ru-sample-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sample:
    # Fork PRs get no secrets; nothing to do there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the sample reads posts.json on origin/main
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      - run: bun scripts/ci/publora-ru-sample.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
