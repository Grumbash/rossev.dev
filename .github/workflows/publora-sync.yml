# The Publora sync: once a day, LinkedIn posts published through Publora become site entries in
# src/data/posts.json (scripts/ci/publora-sync.ts), pass `bun test` and `bun run build`, and land
# as ONE PR from the fixed branch bot/publora-sync, recreated from main on every run. Nothing new
# means no commit and no PR. It never pushes to main: review and merge happen in the PR.
#
# Why a PAT (secret PUBLORA_SYNC_TOKEN): a PR opened with GITHUB_TOKEN does not trigger other
# workflows, so perf.yml would never gate it, and this repo does not allow GitHub Actions to create
# pull requests. A fine-grained PAT (this repo only; Contents and Pull requests read/write) fixes
# both. Without it the run falls back to GITHUB_TOKEN: the push works, the PR step fails.
#
# The API keys reach only the sync step. Model output never reaches a shell: the commit and PR
# title is a fixed string from the script, the PR body is read from a file.
name: publora-sync

on:
  # Two daily slots: GitHub delays or drops scheduled runs under load (the first 06:17 run never
  # came), and a run with nothing new does nothing.
  schedule:
    - cron: '17 6 * * *'
    - cron: '43 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publora-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # to see whether the bot branch carries human commits
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Always exits 0; writes added=N to $GITHUB_OUTPUT (0 on nothing new or on any error).
      - id: sync
        run: bun scripts/ci/publora-sync.ts
        env:
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBLORA_SYNC_MODEL: ${{ vars.PUBLORA_SYNC_MODEL }}
          PUBLORA_SINCE: ${{ vars.PUBLORA_SINCE }}
          PR_BODY_PATH: .publora/pr-body.md

      - if: steps.sync.outputs.added != '' && steps.sync.outputs.added != '0'
        run: bun test

      - if: steps.sync.outputs.added != '' && steps.sync.outputs.added != '0'
        run: bun run build

      - name: Push bot/publora-sync and open or update the PR
        if: steps.sync.outputs.added != '' && steps.sync.outputs.added != '0'
        env:
          GH_TOKEN: ${{ secrets.PUBLORA_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.sync.outputs.title }}
          BRANCH: bot/publora-sync
          PR_BODY_PATH: .publora/pr-body.md
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }

          # A human commit on the bot branch (an edit in review) is never overwritten.
          expect=$(git_auth ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$expect" ]; then
            git_auth fetch --quiet origin "$BRANCH"
            if git log --format=%ae HEAD..FETCH_HEAD | grep -qv '^41898283+github-actions\[bot\]@users.noreply.github.com$'; then
              echo "::notice::$BRANCH has commits by someone other than the bot; leaving it and its PR alone."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git add src/data/posts.json public/llms.txt
          git commit --quiet --message "$TITLE"
          # The lease is the sha seen above (empty: the branch must not exist yet).
          git_auth push --force-with-lease="refs/heads/$BRANCH:$expect" origin "HEAD:refs/heads/$BRANCH"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$PR_BODY_PATH"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body-file "$PR_BODY_PATH"
          fi
