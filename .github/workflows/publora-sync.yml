# The Publora sync: once a day, LinkedIn posts published through Publora become site entries in
# src/data/posts.json (scripts/ci/publora-sync.ts), pass `bun test` and `bun run build`, and land
# as ONE PR from the fixed branch bot/publora-sync, recreated from main on every run. Nothing new
# means no commit and no PR. It never pushes to main: review and merge happen in the PR.
#
# Why a PAT (secret PUBLORA_SYNC_TOKEN): a PR opened with GITHUB_TOKEN does not trigger other
# workflows, so perf.yml would never gate it, and this repo does not allow GitHub Actions to create
# pull requests. A fine-grained PAT (this repo only; Contents and Pull requests read/write) fixes
# both. The protect-main ruleset (PRs only, no bypass) keeps it off main.
#
# Two jobs, two VMs. `sync` installs packages and runs repo code (the sync, tests, build): any of
# that code could be a compromised package, and the runner has passwordless sudo, so this job gets
# the API keys in one step and only read tokens. `publish` runs no package code: a fresh checkout
# of the same main commit, the three files from `sync` copied in, then git and gh with the PAT.
#
# Model output never reaches a shell: the commit and PR title is a fixed string from the script,
# the PR body is read from a file.
name: publora-sync

on:
  # Two daily slots: GitHub delays or drops scheduled runs under load (the first 06:17 run never
  # came), and a run with nothing new does nothing.
  schedule:
    - cron: '17 6 * * *'
    - cron: '43 17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: publora-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      added: ${{ steps.sync.outputs.added }}
      title: ${{ steps.sync.outputs.title }}
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # bun test reads history: the build story and replay tests show old commits
          persist-credentials: false

      # `publish` checks out exactly this commit, so the files it copies in match their base.
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # An open bot PR is under review: a run would re-draft every post in it (new wording, new cost)
      # and force-push over the review. New posts wait until it is merged or closed.
      - id: open-pr
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head bot/publora-sync --state open --json number --jq length)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then echo "An open bot PR is waiting for review; nothing to sync until it is merged or closed."; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always exits 0; writes added=N to $GITHUB_OUTPUT (0 on nothing new or on any error).
      - id: sync
        if: steps.open-pr.outputs.count == '0'
        run: bun scripts/ci/publora-sync.ts
        env:
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBLORA_SYNC_MODEL: ${{ vars.PUBLORA_SYNC_MODEL }}
          PUBLORA_SINCE: ${{ vars.PUBLORA_SINCE }}
          PR_BODY_PATH: .publora/pr-body.md

      - if: steps.sync.outputs.added != '' && steps.sync.outputs.added != '0'
        run: bun test

      - if: steps.sync.outputs.added != '' && steps.sync.outputs.added != '0'
        run: bun run build

      - if: steps.sync.outputs.added != '' && steps.sync.outputs.added != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publora-sync
          path: |
            src/data/posts.json
            public/llms.txt
            .publora/pr-body.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sync
    if: needs.sync.outputs.added != '' && needs.sync.outputs.added != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0 # to see whether the bot branch carries human commits
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publora-sync
          path: ${{ runner.temp }}/publora-sync

      - name: Push bot/publora-sync and open or update the PR
        env:
          GH_TOKEN: ${{ secrets.PUBLORA_SYNC_TOKEN }}
          TITLE: ${{ needs.sync.outputs.title }}
          BRANCH: bot/publora-sync
          IN: ${{ runner.temp }}/publora-sync
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret PUBLORA_SYNC_TOKEN is not set; nothing pushed."; exit 1; fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git_auth() { git -c "http.https://github.com/.extraheader=$auth" "$@"; }

          # `sync` ran package code, so its sha is checked, not trusted: a fork's commit is reachable
          # by sha through this repo, and the bot PR must never be cut from anything but main.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::sync returned no commit sha; nothing pushed."; exit 1; fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then echo "::error::$SHA is not on main; nothing pushed."; exit 1; fi

          # Only these two files ever change; anything else in the artifact is ignored.
          cp "$IN/src/data/posts.json" src/data/posts.json
          cp "$IN/public/llms.txt" public/llms.txt
          body="$IN/.publora/pr-body.md"

          # A human commit on the bot branch (an edit in review) is never overwritten.
          expect=$(git_auth ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$expect" ]; then
            git_auth fetch --quiet origin "$BRANCH"
            # Captured, not piped into grep -q: an early grep exit would SIGPIPE git log under pipefail.
            others=$(git log --format=%ae HEAD..FETCH_HEAD | grep -v '^41898283+github-actions\[bot\]@users.noreply.github.com$' || true)
            if [ -n "$others" ]; then
              echo "::warning::$BRANCH has commits by someone other than the bot; leaving it and its PR alone. Merge or close its PR, or delete the branch, to let the sync push again."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git add src/data/posts.json public/llms.txt
          git commit --quiet --message "$TITLE"
          # The lease is the sha seen above (empty: the branch must not exist yet).
          git_auth push --force-with-lease="refs/heads/$BRANCH:$expect" origin "HEAD:refs/heads/$BRANCH"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body-file "$body"
          fi
