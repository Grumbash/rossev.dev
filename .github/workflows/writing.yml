# Posts written on the site: a PR that adds or edits src/content/writing/<slug>.md gets the other
# language, the brief and a Publora draft from scripts/ci/writing.ts, as one bot commit to
# src/data/posts.json on the PR's own branch, plus a comment with what was written. Nothing is
# scheduled or published: that stays a human step in Publora. Merging the PR puts the post on the site.
#
# Same-repo PRs only: the script runs the PR's code with the API keys, so a fork never gets here.
# Same split as publora-sync.yml: `write` runs package code with the keys and read tokens only;
# `push` runs no package code and holds the PAT (secret PUBLORA_SYNC_TOKEN), which also makes the
# bot commit trigger perf.yml, as a GITHUB_TOKEN push would not. Its commit changes only
# posts.json, so the run it triggers finds every post up to date and stops.
name: writing

on:
  pull_request:
    paths:
      - 'src/content/writing/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: writing-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  write:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.write.outputs.changed }}
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Always exits 0; writes changed=N to $GITHUB_OUTPUT.
      - id: write
        run: bun scripts/ci/writing.ts
        env:
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PUBLORA_SYNC_MODEL: ${{ vars.PUBLORA_SYNC_MODEL }}
          PR_BODY_PATH: .writing/pr-comment.md

      - if: steps.write.outputs.changed != '0'
        run: bun test

      - if: steps.write.outputs.changed != '0'
        run: bun run build

      - if: always() && hashFiles('.writing/pr-comment.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: writing
          path: |
            src/data/posts.json
            .writing/pr-comment.md
          include-hidden-files: true
          retention-days: 1

  push:
    needs: write
    if: always() && needs.write.result != 'skipped' && needs.write.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: writing
          path: ${{ runner.temp }}/writing

      - name: Commit posts.json to the PR branch and comment
        env:
          GH_TOKEN: ${{ secrets.PUBLORA_SYNC_TOKEN }}
          CHANGED: ${{ needs.write.outputs.changed }}
          OK: ${{ needs.write.result }}
          IN: ${{ runner.temp }}/writing
          SHA: ${{ needs.write.outputs.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret PUBLORA_SYNC_TOKEN is not set; nothing pushed."; exit 1; fi
          comment="$IN/.writing/pr-comment.md"
          # A failed test or build pushes nothing; the comment still says what was drafted.
          if [ "$OK" = "success" ] && [ "$CHANGED" != "0" ] && [ -f "$IN/src/data/posts.json" ]; then
            # The PR moved on since `write` read it: that push starts a fresh run.
            if [ "$(git rev-parse HEAD)" != "$SHA" ]; then echo "The branch moved; the next run writes."; exit 0; fi
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            cp "$IN/src/data/posts.json" src/data/posts.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
            git add src/data/posts.json
            git commit --quiet --message "Fill in the site entries for src/content/writing"
            git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$BRANCH"
          elif [ "$CHANGED" != "0" ] && [ "$CHANGED" != "" ]; then
            echo "::warning::Tests or the build failed on the drafted entries; nothing pushed."
          fi
          if [ -f "$comment" ]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$comment"; fi
