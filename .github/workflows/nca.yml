# The NCA simulations: the GR automaton grown, bitten, cut and regrown on the shipped weights, and
# the PR #11 replay re-run from its round-1 weights. Each file is 30–45 s of one core. In the perf
# job they shared a 4-vCPU runner with the rest of the suite and timed out against each other, so
# here every file in scripts/ci/simulations.json gets a runner of its own. The perf job skips them.
#
# Runs on PRs that touch the automaton, its weights, the replay or these tests; nightly on main
# catches what the path filter can't see (a new bun, a new runner image).
name: nca

# Quoted: YAML 1.1 parsers (Bun.YAML in the tests) read a bare `on` as the boolean true.
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/scripts/nca/**'
      - 'src/scripts/replay/**'
      - 'public/nca/**'
      - 'public/replay/**'
      - 'scripts/nca/**'
      - 'scripts/build-story.ts'
      - 'src/data/build-story*.json'
      - 'src/data/replay-*.json'
      - 'tests/nca*.test.ts'
      - 'tests/replay-*.test.ts'
      - 'tests/fixtures/nca-regrow.ts'
      - 'scripts/ci/simulations.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/nca.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nca-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/simulations.json
          sparse-checkout-cone-mode: false

      - id: list
        run: echo "files=$(jq -c . scripts/ci/simulations.json)" >> "$GITHUB_OUTPUT"

  simulate:
    needs: list
    runs-on: ubuntu-latest
    # A hang guard: alone on a runner the slowest file takes about two minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.list.outputs.files) }}
    name: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # replay-data checks the PR #11 commits it replays
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The file name comes from the PR's own simulations.json: pass it as data, not as script.
      - run: bun test "$FILE"
        env:
          FILE: ${{ matrix.file }}
