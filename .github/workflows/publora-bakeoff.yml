# ONE-OFF, delete before merge: the model bake-off for the Publora sync. On this PR it takes two
# of Gleb's published LinkedIn posts from Publora, runs the candidate models through the sync's own
# prompt and validator, and writes EN entry + RU adaptation + real cost side by side to the Job
# Summary. It writes nothing to the repo and comments nowhere. Keys come only from repo secrets.
name: publora-bakeoff

on:
  pull_request:
    paths:
      - 'scripts/ci/publora-bakeoff.ts'
      - '.github/workflows/publora-bakeoff.yml'

permissions:
  contents: read

concurrency:
  group: publora-bakeoff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bakeoff:
    # Fork PRs get no secrets; nothing to do there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      - run: bun scripts/ci/publora-bakeoff.ts
        env:
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
